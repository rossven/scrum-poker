spring:
  application:
    name: sprintmasasi
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  # Ters vekil (Render vb.) arkasında gerçek istemci IP'si için "native".
  # Varsayılan kapalı: doğrudan erişimde X-Forwarded-For sahte olabilir.
  forward-headers-strategy: ${SM_FORWARD_HEADERS:none}
  # Metin yanıtları sıkıştırılır (JS/CSS/HTML; sayfa hızı)
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024

sprintmasasi:
  # Oda başına en fazla bağlı kişi (güvenlik tavanı)
  max-participants: ${SM_MAX_PARTICIPANTS:100}
  # Hareketsiz odalar bu süre sonra silinir (gün)
  idle-expiry-days: ${SM_IDLE_EXPIRY_DAYS:7}
  # Moderatör kopunca devir için bekleme (saniye)
  moderator-grace-seconds: ${SM_MODERATOR_GRACE_SECONDS:20}
  # Virgülle ayrılmış izinli origin'ler. Boşsa yalnızca aynı origin.
  allowed-origins: ${SM_ALLOWED_ORIGINS:}
  # Yanlış şifre denemesi sınırı (IP + oda başına, pencere içinde)
  password-max-attempts: ${SM_PASSWORD_MAX_ATTEMPTS:5}
  password-window-seconds: ${SM_PASSWORD_WINDOW_SECONDS:300}
  # Oda oluşturma hız sınırı (IP başına, dakikada)
  create-rooms-per-minute: ${SM_CREATE_ROOMS_PER_MINUTE:10}
  # WebSocket mesaj hız sınırı (katılımcı başına, saniyede)
  messages-per-second: ${SM_MESSAGES_PER_SECOND:20}
  # Sunucudaki toplam oda tavanı (bellek koruması; dolunca yeni oda açılamaz)
  max-rooms: ${SM_MAX_ROOMS:2000}
  # Yeni koltukla katılma sınırı (IP başına, dakikada; token'la geri dönüş sayılmaz)
  joins-per-minute: ${SM_JOINS_PER_MINUTE:60}
  # WebSocket bağlantı açma sınırı (IP başına, dakikada)
  socket-connects-per-minute: ${SM_SOCKET_CONNECTS_PER_MINUTE:120}
